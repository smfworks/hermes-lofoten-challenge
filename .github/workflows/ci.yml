name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  isolated-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - team-maelstrom/hermes-plugin-tool-telemetry/test_tool_telemetry.py
          - team-stockfish/hermes-plugin-skill-gap-analyzer/test_skill_gap_analyzer.py
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run isolated suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider -q --import-mode=importlib ${{ matrix.suite }}
